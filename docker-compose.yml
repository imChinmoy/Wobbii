services:
  postgres:
    image: postgres:17-alpine
    container_name: wobbii-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wobbii
      POSTGRES_PASSWORD: wobbii_dev
      POSTGRES_DB: wobbii
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wobbii -d wobbii"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
